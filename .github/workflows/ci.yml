name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: inventaire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d inventaire_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/inventaire_test
      SESSION_SECRET: ci-session-secret-ci-session-secret-00
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
      OFF_USER_AGENT: InventaireMaison-CI/1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @inventaire/shared
      - run: npm run test:api

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @inventaire/shared
      - run: npm run test:web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/inventaire_test
      SESSION_SECRET: ci-session-secret-ci-session-secret-00
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
      OFF_USER_AGENT: InventaireMaison-CI/1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_DOMAIN: localhost
      POSTGRES_PASSWORD: ci-postgres-password
      SESSION_SECRET: ci-session-secret-ci-session-secret-00
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
      OFF_USER_AGENT: InventaireMaison-CI/1.0
      COMPOSE_BAKE: 'false'
      COMPOSE_PROFILES: proxy
      COMPOSE_FILE: docker-compose.yml:.github/ci/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: buildx-${{ runner.os }}-
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Health check through the proxy
        run: |
          curl -sfk https://localhost/api/health | tee /dev/stderr | grep -q '"status":"ok"'
      - name: Show state on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=80
      - name: Rotate layer cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then mv /tmp/.buildx-cache-new /tmp/.buildx-cache; fi
      - if: always()
        run: docker compose down -v

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: No .env committed
        run: test -z "$(git ls-files .env)"

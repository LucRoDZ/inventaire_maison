x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  proxy:
    image: caddy:2
    profiles: [proxy]
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3001'
      DATABASE_URL: postgres://inventaire:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/inventaire
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquant dans .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME manquant dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans .env}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-InventaireMaison/1.0}
      PUBLIC_ORIGIN: https://${APP_DOMAIN:-localhost}
      IMAGES_DIR: /data/images
    volumes:
      - images:/data/images
    networks: [edge, backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventaire
      POSTGRES_DB: inventaire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventaire -d inventaire']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

networks:
  edge:
  backend:
    internal: true

volumes:
  pgdata:
  images:
  caddy_data:
  caddy_config:
